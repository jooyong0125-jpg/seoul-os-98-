name: SeoulOS QA

on:
  pull_request:
  push:
    branches:
      - main
      - final-project-hardening

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js scripts/*.mjs; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate memory content and asset formats
        run: node scripts/validate-content.mjs

      - name: Report final release readiness
        continue-on-error: true
        run: node scripts/release-readiness.mjs
